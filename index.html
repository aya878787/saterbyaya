<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sater ByAya |سطر</title>
     <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234A7C3F'/%3E%3Ctext x='50' y='50' font-family='Tajawal, Arial, sans-serif' font-size='70' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3E%D8%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ========== الهيدر ========== -->
  <header class="header">
    <div class="container header-content">
      <a href="#" class="logo">
        <span class="logo-main">Sater ByAya</span>
        <span class="logo-sub">سطر</span>
      </a>
      <button class="cart-btn" id="cartBtn">
        🛒 السلة
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- ========== القسم الترحيبي ========== -->
  <section class="hero">
    <div class="container hero-content">
      <h1>جمالٌ يليق بذكرياتك</h1>
      <p>براويز مصنوعة بعناية لتحفظ أجمل لحظاتك</p>
      <a href="#products" class="btn-primary">تسوق الآن</a>
    </div>
  </section>

  <!-- ========== قسم المنتجات ========== -->
  <section class="products-section" id="products">
    <div class="container">
      <h2 class="section-title">منتجاتنا</h2>
      
      <div class="products-grid" id="productsGrid">
        <!-- يتم تعبئة المنتجات هنا تلقائياً -->
        <div class="loading">جاري تحميل المنتجات...</div>
      </div>
    </div>
  </section>

  <!-- ========== السلة الجانبية ========== -->
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>سلة التسوق</h3>
      <button class="close-btn" id="closeCart">✕</button>
    </div>
    
    <div class="cart-items" id="cartItems">
      <!-- يتم تعبئة العناصر هنا -->
    </div>
    
    <div class="cart-footer">
      <div class="cart-total">
        <span>المجموع:</span>
        <span id="cartTotal">0 د.أ</span>
      </div>
      <button class="btn-checkout" id="checkoutBtn">إتمام الطلب عبر واتساب</button>
    </div>
  </aside>

  <!-- ========== طبقة معتمة ========== -->
  <div class="overlay" id="overlay"></div>

  <!-- ========== نموذج الطلب ========== -->
  <div class="order-modal" id="orderModal">
    <div class="order-modal-content">
      <button class="close-btn" id="closeOrder">✕</button>
      <h3>إتمام الطلب</h3>
      <p class="order-note">سيتم إرسال طلبك عبر واتساب</p>
      
      <form id="orderForm">
        <div class="form-group">
          <label for="customerName">الاسم الكامل *</label>
          <input type="text" id="customerName" required placeholder="مثال: أحمد محمد">
        </div>
        
        <div class="form-group">
          <label for="customerPhone">رقم الهاتف *</label>
          <input type="tel" id="customerPhone" required placeholder="07XXXXXXXX">
        </div>
        
        <div class="form-group">
          <label for="customerAddress">العنوان</label>
          <textarea id="customerAddress" rows="2" required  placeholder="المدينة، المنطقة، تفاصيل إضافية"></textarea>
        </div>
        
        <div class="form-group">
          <label for="customerNote">ملاحظات (اختياري)</label>
          <textarea id="customerNote" rows="2" placeholder="أي تفاصيل إضافية"></textarea>
        </div>
        
        <button type="submit" class="btn-submit">تأكيد وإرسال عبر واتساب</button>
      </form>
    </div>
  </div>

  <!-- ========== الفوتر ========== -->
 <footer class="footer">
    <div class="container">
      <a href="https://www.instagram.com/sater_by.aya" target="_blank" rel="noopener" class="instagram-link" aria-label="تابعنا على انستغرام">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>تابعنا على انستغرام</span>
      </a>
      <p>سطر &copy; 2026 — جميع الحقوق محفوظة</p>
      <p class="footer-sub">براويز مصنوعة بحب 🤎</p>
    </div>
  </footer>
  <!-- ========== إشعار ========== -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
